name: CI/CD deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            REPO_DIR="/opt/velopredict"
            mkdir -p "$REPO_DIR"

            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR"
              git fetch origin
              git checkout main
              git reset --hard origin/main
            else
              git clone https://github.com/${{ github.repository }}.git "$REPO_DIR"
              cd "$REPO_DIR"
            fi

            python3 -m venv "$REPO_DIR/.venv"
            . "$REPO_DIR/.venv/bin/activate"
            pip install --upgrade pip
            pip install -r "$REPO_DIR/requirements.txt"

            sudo tee /etc/systemd/system/velopredict.service > /dev/null <<EOF
            [Unit]
            Description=VeloPredict App
            After=network.target

            [Service]
            User=${{ secrets.EC2_USER }}
            WorkingDirectory=$REPO_DIR
            Environment=WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}
            ExecStart=$REPO_DIR/.venv/bin/uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            EOF

            sudo systemctl daemon-reload
            sudo systemctl enable --now velopredict
            sudo systemctl restart velopredict
